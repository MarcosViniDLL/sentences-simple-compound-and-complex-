site_name: Sentence Structure
site_description: A bilingual study guide for English sentence structure and conjunctions.
site_author: Marcos Vinicius De Lira Lourenço

theme:
  name: material
  language: en

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 🏠 Home: index.md

  - 📖 Chapter 1 — Sentence Structure: capitulo-01.md
  - 🤝 Chapter 2 — Coordination: capitulo-02.md
  - 📌 Chapter 3 — FANBOYS: capitulo-03.md
  - 🔗 Chapter 4 — Subordinating Conjunctions: capitulo-04.md
  - 📝 Chapter 5 — Practice Exercises: capitulo-05.md
  - ​🧶 Chapter 6 - Aula do dia 10/08: capitulo-06.md
  - 🎧 Chapter 7 - Vocabulary, Sentence Building & Listening: capitulo-07.md

  - ✅ Answer Key: answer-key.md